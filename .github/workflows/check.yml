name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run secrets:check
      - run: npx wrangler types --include-runtime false --strict-vars false && head -n 2 worker-configuration.d.ts
      - run: npm run check
      - run: npx wrangler types --check --include-runtime false --strict-vars false
      - run: npm run check:runtime
        env:
          WRANGLER_SEND_METRICS: "false"
